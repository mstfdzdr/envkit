ShortDescription: Manage Windows environment variables and PATH safely, with previews and undo.
Description: |-
  EnvKit is a desktop app and CLI (envkit) for Windows environment variables. It finds dead,
  duplicate and shadowing PATH entries, shows a diff before every change, snapshots the state
  so any change can be undone, and only asks for administrator rights for machine-scope edits.
